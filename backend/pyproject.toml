[project]
name = "portfolio-manager-backend"
version = "0.1.0"
description = "Portfolio analysis backend (Phase 1)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "yfinance>=0.2.40",
  "pandas>=2.2",
  "numpy>=1.26",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "pytesseract>=0.3.10",
  "pillow>=10.4",
  "google-genai>=1.0",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "types-Pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits live external APIs (skipped by default)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*:Warning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = false
