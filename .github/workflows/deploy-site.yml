name: Deploy site

# Builds the static site and deploys it (with the /api proxy) as the Cloudflare Worker in
# frontend/wrangler.jsonc. Needs two repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Without them the job only prints a notice. API_ORIGIN and PROXY_SHARED_SECRET live in the Worker's
# Settings -> Variables and Secrets (wrangler keep_vars keeps them across deploys). See docs/deployment.md.

on:
  push:
    branches: ["ccr-8e00f184-rqshto"]
    paths: ["frontend/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check secrets
        id: gate
        working-directory: .
        # Secrets are exposed only to the steps that need them (this gate and the deploy), never to npm scripts.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set; skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # TODO(pin-sha): pin this action to a full commit SHA, tag as trailing comment (not verified offline)
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      # TODO(pin-sha): pin this action to a full commit SHA, tag as trailing comment (not verified offline)
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # No lifecycle scripts from dependencies; the OCR assets are copied by the explicit step below (build repeats it).
      - run: npm ci --ignore-scripts
        if: steps.gate.outputs.go == 'true'
      - run: npm run assets:ocr
        if: steps.gate.outputs.go == 'true'
      - run: npm run build
        if: steps.gate.outputs.go == 'true'
      # wrangler is a pinned devDependency (frontend/package.json); npx uses the local copy, never a download.
      - run: npx --no-install wrangler deploy
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
